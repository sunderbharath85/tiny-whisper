[package]
name = "tiny-whisper"
version = "1.0.0"
description = "Local Whisper live-transcribe with push-to-talk"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "1"
parking_lot = "0.12"
once_cell = "1"
log = "0.4"
env_logger = "0.11"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "fs", "io-util"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }

cpal = "0.15"
rubato = "0.15"
hound = "3.5"

# whisper-rs. GPU backend is opt-in via the `metal` / `vulkan` features below so the
# default CPU build doesn't require a Vulkan SDK. `use_gpu(bool)` on
# WhisperContextParameters toggles at runtime when a GPU backend is compiled in.
# `raw-api` re-exports whisper-rs-sys, for ggml's device list (src/gpu.rs).
whisper-rs = { version = "0.16", default-features = false, features = ["raw-api"] }

# Parakeet ASR (CTC + TDT) via ONNX Runtime. CPU by default; the `vulkan`
# feature below enables DirectML on Windows so we can match whisper's GPU toggle.
parakeet-rs = { version = "0.3", default-features = false, features = ["cpu", "sortformer"] }
# Not used directly: picks ort's features for parakeet-rs. These are ort's
# defaults minus `copy-dylibs`, whose build script assumes cargo's old target
# layout and panics on newer stable Rust (it tries to copy DirectML.dll into
# target/<profile>/build/examples). ONNX Runtime links statically either way,
# and the bundle never shipped that DLL; Windows provides DirectML.dll.
ort = { version = "2.0.0-rc.12", default-features = false, features = ["std", "ndarray", "tracing", "download-binaries", "tls-native", "api-24"] }

[dependencies.arboard]
version = "3"

[dependencies.enigo]
version = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Web inspector in release builds (debug builds always have it). Off by default
# so shipped builds have no right-click > Inspect; opt in with `--features devtools`.
devtools = ["tauri/devtools"]
# GPU builds. Cargo features can't differ per platform, so pick the one for
# the platform you build on (e.g. `npm run tauri build -- --features vulkan`):
#   macOS:   `metal`  - Metal for whisper, CoreML for Parakeet/Sortformer
#   Windows: `vulkan` - Vulkan for whisper, DirectML for Parakeet/Sortformer.
#            Needs the Vulkan SDK (VULKAN_SDK, glslc) to build; at runtime
#            vulkan-1.dll ships with GPU drivers.
# Both turn on `gpu`, which the code checks. Don't enable `gpu` on its own:
# it would ask for a GPU backend that isn't compiled in.
gpu = []
metal = ["gpu", "whisper-rs/metal", "parakeet-rs/coreml"]
vulkan = ["gpu", "whisper-rs/vulkan", "parakeet-rs/directml"]
