name: Release

# Push a tag like v1.0.0 (matching the version in package.json, Cargo.toml and
# tauri.conf.json — see scripts/version.mjs) to build installers for every
# platform and attach them to a DRAFT GitHub release. Review it, then publish.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v1.0.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag matches app version
        id: version
        run: echo "version=$(node scripts/version.mjs --tag "$TAG")" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $v; using a placeholder."
            echo "Tiny Whisper $v" > notes.md
          fi
          cat notes.md
      - name: Create (or reuse) the draft release
        id: release
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const fs = require("fs");
            const tag = process.env.TAG;
            const body = fs.readFileSync("notes.md", "utf8");
            const name = `Tiny Whisper ${tag.replace(/^v/, "")}`;
            // getReleaseByTag doesn't see drafts, so search the list.
            const all = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = all.find((r) => r.tag_name === tag);
            if (existing) {
              if (!existing.draft) core.setFailed(`${tag} is already published; bump the version instead.`);
              await github.rest.repos.updateRelease({ ...context.repo, release_id: existing.id, name, body });
              return String(existing.id);
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name, body, draft: true,
              prerelease: tag.includes("-"),
            });
            return String(data.id);

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --features gpu
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: Linux
            # glibc 2.38+ is required by the prebuilt ONNX Runtime (see ci.yml).
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      # tauri.conf.json signs with a certificate thumbprint from the
      # maintainer's machine. In CI: import WINDOWS_CERTIFICATE (base64 .pfx)
      # and sign with it, or drop signing and build an unsigned installer.
      - name: Windows signing
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($signtool) { Add-Content $env:GITHUB_PATH $signtool.DirectoryName }
          if ($env:WINDOWS_CERTIFICATE) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\cert.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item "$env:RUNNER_TEMP\cert.pfx"
            $cmd = "signtool sign /sha1 $($cert.Thumbprint) /fd sha256 /tr http://timestamp.digicert.com /td sha256 %1"
            @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Depth 5 | Set-Content ci-tauri.json
          } else {
            Write-Output "::warning::WINDOWS_CERTIFICATE is not set; the Windows installer will be unsigned."
            '{"bundle":{"windows":{"signCommand":null}}}' | Set-Content ci-tauri.json
          }
          "args=--config ci-tauri.json" >> $env:GITHUB_OUTPUT

      # Developer ID signing + notarization, only when the secrets exist.
      # Without them the bundle keeps the ad-hoc signature from tauri.conf.json.
      - name: macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty variables would make the Tauri bundler try (and fail) to sign.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          [ -n "$APPLE_CERTIFICATE" ] || echo "::warning::Apple signing secrets not set; macOS build is ad-hoc signed (users must right-click → Open)."

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}
