name: Release

# Two ways to release (both build every platform into a DRAFT GitHub release
# that you review and publish):
#   • Actions → Release → Run workflow on main, with a version like 1.0.0.
#     The tag v1.0.0 is created on main's current commit if it doesn't exist.
#   • Or push a tag yourself: git tag v1.0.0 && git push origin v1.0.0
# Either way the version must match package.json, Cargo.toml and
# tauri.conf.json (see scripts/version.mjs), and CHANGELOG.md supplies the notes.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (tag v1.0.0 is created from this branch if missing)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REQUESTED: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      sha: ${{ steps.resolve.outputs.sha }}
      release_id: ${{ steps.release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      # Find the commit to build: the tag's, or (when releasing from the
      # Actions tab with a new version) the commit the run was started on.
      - name: Resolve tag
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            const raw = process.env.REQUESTED.trim();
            const tag = raw.startsWith("v") ? raw : `v${raw}`;
            if (!/^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/.test(tag)) {
              throw new Error(`"${raw}" is not a version like 1.0.0`);
            }
            core.setOutput("tag", tag);
            try {
              const { data } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              let sha = data.object.sha;
              if (data.object.type === "tag") {
                // Annotated tag: follow it to the commit.
                sha = (await github.rest.git.getTag({ ...context.repo, tag_sha: sha })).data.object.sha;
              }
              core.info(`${tag} exists at ${sha}`);
              core.setOutput("sha", sha);
              core.setOutput("create", "false");
            } catch (e) {
              if (e.status !== 404) throw e;
              const main = `refs/heads/${context.payload.repository.default_branch}`;
              if (context.ref !== main) {
                throw new Error(`${tag} doesn't exist. Start the run from ${main.slice(11)} to create it.`);
              }
              core.info(`${tag} will be created at ${context.sha}`);
              core.setOutput("sha", context.sha);
              core.setOutput("create", "true");
            }
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tag matches app version
        id: version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: echo "version=$(node scripts/version.mjs --tag "$TAG")" >> "$GITHUB_OUTPUT"
      # Only after the version check, so a mismatch never leaves a stray tag.
      - name: Create tag
        if: steps.resolve.outputs.create == 'true'
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          SHA: ${{ steps.resolve.outputs.sha }}
        with:
          script: |
            await github.rest.git.createRef({ ...context.repo, ref: `refs/tags/${process.env.TAG}`, sha: process.env.SHA });
            core.info(`Created ${process.env.TAG} at ${process.env.SHA}`);
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ steps.version.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::warning::No CHANGELOG.md section for $v; using a placeholder."
            echo "Tiny Whisper $v" > notes.md
          fi
          cat notes.md
      - name: Create (or reuse) the draft release
        id: release
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        with:
          result-encoding: string
          script: |
            const fs = require("fs");
            const tag = process.env.TAG;
            const body = fs.readFileSync("notes.md", "utf8");
            const name = `Tiny Whisper ${tag.replace(/^v/, "")}`;
            // getReleaseByTag doesn't see drafts, so search the list.
            const all = await github.paginate(github.rest.repos.listReleases, context.repo);
            const existing = all.find((r) => r.tag_name === tag);
            if (existing) {
              if (!existing.draft) throw new Error(`${tag} is already published; bump the version instead.`);
              await github.rest.repos.updateRelease({ ...context.repo, release_id: existing.id, name, body });
              return String(existing.id);
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name, body, draft: true,
              prerelease: tag.includes("-"),
            });
            return String(data.id);

  build:
    name: Build ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --features metal
          # No Intel macOS build: ort (Parakeet) has no prebuilt ONNX Runtime
          # for x86_64-apple-darwin.
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            # GPU build: Vulkan for whisper, DirectML for Parakeet. Falls back
            # to the CPU on PCs without a GPU (see "Vulkan SDK" below).
            args: --features vulkan --config src-tauri/tauri.vulkan.conf.json
          - name: Linux
            # glibc 2.38+ is required by the prebuilt ONNX Runtime (see ci.yml).
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    # whisper.cpp build flags (portable CPU code, optimized MSVC builds) live
    # in src-tauri/.cargo/config.toml so local builds get them too.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libasound2-dev libxdo-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # "-portable": whisper-rs-sys doesn't rebuild when its GGML_*/CMAKE_*
          # env changes, so an older cache would bring back AVX-512 code and
          # the unoptimized build.
          key: ${{ matrix.target }}-portable

      # The SDK provides glslc and the headers whisper.cpp's Vulkan backend
      # builds against; its runtime provides vulkan-1.dll, which the installer
      # ships next to the exe (src-tauri/tauri.vulkan.conf.json). With the
      # loader bundled the app starts on PCs without a GPU driver and uses the
      # CPU there. 1.4.341.1 is the SDK this build was verified with locally.
      - name: Vulkan SDK
        if: runner.os == 'Windows'
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.341.1
          install_runtime: true
          cache: true
      - name: Bundle the Vulkan loader
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = Get-ChildItem "C:\VulkanSDK", "$env:VULKAN_SDK" -Recurse -Filter vulkan-1.dll -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $dll) { $dll = Get-Item "$env:SystemRoot\System32\vulkan-1.dll" -ErrorAction SilentlyContinue }
          if (-not $dll) { throw "vulkan-1.dll not found after installing the Vulkan runtime" }
          New-Item -ItemType Directory -Force src-tauri/vendor | Out-Null
          Copy-Item $dll.FullName src-tauri/vendor/vulkan-1.dll
          Write-Output "Bundling $($dll.FullName) $($dll.VersionInfo.FileVersion)"
          # whisper.cpp's Vulkan shader generator nests deep enough under
          # src-tauri\target that MSBuild passes Windows' 248-character folder
          # limit (FTK1011), so keep cargo's intermediate files in a short dir.
          "CARGO_BUILD_BUILD_DIR=C:\b" >> $env:GITHUB_ENV

      # tauri.conf.json signs with a certificate thumbprint from the
      # maintainer's machine. In CI: import WINDOWS_CERTIFICATE (base64 .pfx)
      # and sign with it, or drop signing and build an unsigned installer.
      - name: Windows signing
        id: winsign
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if ($signtool) { Add-Content $env:GITHUB_PATH $signtool.DirectoryName }
          if ($env:WINDOWS_CERTIFICATE) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $pw = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\cert.pfx" -CertStoreLocation Cert:\CurrentUser\My -Password $pw
            Remove-Item "$env:RUNNER_TEMP\cert.pfx"
            $cmd = "signtool sign /sha1 $($cert.Thumbprint) /fd sha256 /tr http://timestamp.digicert.com /td sha256 %1"
            @{ bundle = @{ windows = @{ signCommand = $cmd } } } | ConvertTo-Json -Depth 5 | Set-Content ci-tauri.json
          } else {
            Write-Output "::warning::WINDOWS_CERTIFICATE is not set; the Windows installer will be unsigned."
            '{"bundle":{"windows":{"signCommand":null}}}' | Set-Content ci-tauri.json
          }
          "args=--config ci-tauri.json" >> $env:GITHUB_OUTPUT

      # Developer ID signing + notarization, only when the secrets exist.
      # Without them the bundle keeps the ad-hoc signature from tauri.conf.json.
      - name: macOS signing
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Empty variables would make the Tauri bundler try (and fail) to sign.
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!v}" ]; then
              { echo "$v<<__EOF__"; echo "${!v}"; echo "__EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          [ -n "$APPLE_CERTIFICATE" ] || echo "::warning::Apple signing secrets not set; macOS build is ad-hoc signed (users must right-click → Open)."

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Pin npm: the action guesses the package manager from lockfiles
          # and picks bun when bun.lock is present, which the runners lack.
          tauriScript: npm run tauri
          args: ${{ matrix.args }} ${{ steps.winsign.outputs.args }}
